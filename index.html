
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClientFlow - Gestion commerciale</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5fa;
      color: #172033;
    }
    header {
      background: #172554;
      color: white;
      padding: 22px;
    }
    header h1 { margin: 0; }
    header p { color: #cbd5e1; }
    main { padding: 18px; max-width: 900px; margin: auto; }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .card, .panel {
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px #0000000d;
    }
    .card strong { font-size: 23px; display: block; }
    .card span { color: #64748b; font-size: 13px; }
    h2 { font-size: 19px; }
    input, button {
      width: 100%;
      padding: 13px;
      margin: 6px 0;
      border-radius: 8px;
      font-size: 15px;
    }
    input { border: 1px solid #cbd5e1; }
    button {
      border: 0;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }
    .item {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }
    @media(max-width:500px) {
      .stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<header>
  <h1>ClientFlow</h1>
  <p>Votre gestion commerciale simplifiée</p>
</header>

<main>
  <div class="stats">
    <div class="card">
      <strong id="totalClients">0</strong>
      <span>Total clients</span>
    </div>
    <div class="card">
      <strong id="totalProducts">0</strong>
      <span>Produits</span>
    </div>
    <div class="card">
      <strong id="totalSales">0 FCFA</strong>
      <span>Ventes</span>
    </div>
  </div>

  <section class="panel">
    <h2>Ajouter un client</h2>
    <input id="clientName" placeholder="Nom du client">
    <input id="clientPhone" placeholder="Téléphone">
    <button onclick="addClient()">Ajouter le client</button>
    <div id="clients"></div>
  </section>

  <section class="panel">
    <h2>Ajouter un produit</h2>
    <input id="productName" placeholder="Nom du produit">
    <input id="productPrice" type="number" placeholder="Prix en FCFA">
    <button onclick="addProduct()">Ajouter le produit</button>
    <div id="products"></div>
  </section>

  <section class="panel">
    <h2>Enregistrer une vente</h2>
    <input id="saleAmount" type="number" placeholder="Montant en FCFA">
    <button onclick="addSale()">Enregistrer la vente</button>
    <div id="sales"></div>
  </section>
</main>

<script>
  let clients = JSON.parse(localStorage.getItem("cf_clients") || "[]");
  let products = JSON.parse(localStorage.getItem("cf_products") || "[]");
  let sales = JSON.parse(localStorage.getItem("cf_sales") || "[]");

  function save() {
    localStorage.setItem("cf_clients", JSON.stringify(clients));
    localStorage.setItem("cf_products", JSON.stringify(products));
    localStorage.setItem("cf_sales", JSON.stringify(sales));
    render();
  }

  function addClient() {
    const name = document.getElementById("clientName").value.trim();
    const phone = document.getElementById("clientPhone").value.trim();
    if (!name) return alert("Entre le nom du client.");
    clients.push({name, phone});
    document.getElementById("clientName").value = "";
    document.getElementById("clientPhone").value = "";
    save();
  }

  function addProduct() {
    const name = document.getElementById("productName").value.trim();
    const price = Number(document.getElementById("productPrice").value);
    if (!name || price <= 0) return alert("Entre un nom et un prix valide.");
    products.push({name, price});
    document.getElementById("productName").value = "";
    document.getElementById("productPrice").value = "";
    save();
  }

  function addSale() {
    const amount = Number(document.getElementById("saleAmount").value);
    if (amount <= 0) return alert("Entre un montant valide.");
    sales.push(amount);
    document.getElementById("saleAmount").value = "";
    save();
  }

  function render() {
    document.getElementById("totalClients").textContent = clients.length;
    document.getElementById("totalProducts").textContent = products.length;
    document.getElementById("totalSales").textContent =
      sales.reduce((a,b) => a+b, 0).toLocaleString("fr-FR") + " FCFA";

    document.getElementById("clients").innerHTML =
      clients.map(c => `<div class="item">${c.name} — ${c.phone}</div>`).join("");

    document.getElementById("products").innerHTML =
      products.map(p => `<div class="item">${p.name} — ${p.price.toLocaleString("fr-FR")} FCFA</div>`).join("");

    document.getElementById("sales").innerHTML =
      sales.map((s,i) => `<div class="item">Vente ${i+1} — ${s.toLocaleString("fr-FR")} FCFA</div>`).join("");
  }

  render();
</script>
</body>
</html>
